<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - BQD Math</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#1B2A4A',
              pastel: '#E8F4FD',
              pastelLight: '#F2F8FD',
              border: '#D8E9F6'
            }
          },
          fontFamily: {
            sans: ['Comfortaa', 'sans-serif'],
          },
          borderRadius: {
            '3xl': '24px',
            '4xl': '32px'
          },
          boxShadow: {
            'soft': '0 20px 40px -15px rgba(27, 42, 74, 0.07)',
            'card': '0 25px 50px -12px rgba(27, 42, 74, 0.08)'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Comfortaa', sans-serif;
    }
  </style>
</head>
<body class="bg-white text-[#1B2A4A] min-h-screen flex items-center justify-center p-6 sm:p-10 lg:p-16">

  <!-- MAIN CONTAINER (DESKTOP 1440 MAX-WIDTH) -->
  <main class="w-full max-w-[1240px] min-h-[720px] grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-stretch">

    <!-- LEFT COLUMN: PASTEL BLUE PANEL (ROUNDED 24px) -->
    <section class="bg-[#E8F4FD] rounded-[24px] p-10 sm:p-14 lg:p-16 flex flex-col justify-between relative overflow-hidden shadow-soft">
      <!-- Decorative background blur accents -->
      <div class="absolute -top-20 -right-20 w-64 h-64 bg-white/40 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -left-20 w-72 h-72 bg-white/50 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Top Header / Logo -->
      <div class="relative z-10 space-y-8">
        <a href="index.html" class="inline-flex items-center gap-3 group">
          <div class="w-12 h-12 rounded-[16px] bg-[#1B2A4A] text-white flex items-center justify-center text-2xl font-bold shadow-md transition-transform group-hover:scale-105">
            Σ
          </div>
          <span class="text-2xl font-bold tracking-tight text-[#1B2A4A]">BQD Math</span>
        </a>

        <!-- Welcome Text -->
        <div class="space-y-3 pt-4">
          <h1 class="text-3xl sm:text-4xl font-bold text-[#1B2A4A] leading-tight">
            Chào mừng trở lại
          </h1>
          <p class="text-[#1B2A4A]/70 text-sm sm:text-base leading-relaxed">
            Học tập thông minh và bứt phá điểm số môn Toán THPT Quốc gia.
          </p>
        </div>
      </div>

      <!-- Simple Math Illustration (Graph & Formula Shapes) -->
      <div class="relative z-10 py-10 flex items-center justify-center">
        <div class="w-full max-w-[340px] aspect-square relative flex items-center justify-center">
          
          <!-- Abstract Coordinate Grid & Smooth Curve SVG -->
          <svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
            <!-- Grid Lines -->
            <path d="M40 80H280" stroke="#1B2A4A" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 4"/>
            <path d="M40 160H280" stroke="#1B2A4A" stroke-opacity="0.12" stroke-width="1.5"/>
            <path d="M40 240H280" stroke="#1B2A4A" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 4"/>
            
            <path d="M80 40V280" stroke="#1B2A4A" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 4"/>
            <path d="M160 40V280" stroke="#1B2A4A" stroke-opacity="0.12" stroke-width="1.5"/>
            <path d="M240 40V280" stroke="#1B2A4A" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 4"/>

            <!-- Area under curve (Integral style fill) -->
            <path d="M60 210 C100 210, 120 90, 160 90 C200 90, 220 230, 260 230 L260 240 L60 240 Z" fill="#1B2A4A" fill-opacity="0.04"/>

            <!-- Main Mathematical Curve: f(x) -->
            <path d="M50 220 C100 220, 120 80, 160 80 C200 80, 220 240, 270 240" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>

            <!-- Tangent Line -->
            <path d="M110 80 L210 80" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="3 3"/>

            <!-- Peak Key Point (Cực trị) -->
            <circle cx="160" cy="80" r="6" fill="#1B2A4A"/>
            <circle cx="160" cy="80" r="12" stroke="#1B2A4A" stroke-opacity="0.25" stroke-width="2"/>

            <!-- Secondary Inflection Point -->
            <circle cx="215" cy="160" r="4.5" fill="white" stroke="#1B2A4A" stroke-width="2"/>

            <!-- Soft floating formula badges -->
            <g transform="translate(45, 60)">
              <rect width="66" height="28" rx="14" fill="white" fill-opacity="0.9" filter="drop-shadow(0 4px 10px rgba(27,42,74,0.06))"/>
              <text x="33" y="18" font-family="Comfortaa" font-size="11" font-weight="700" fill="#1B2A4A" text-anchor="middle">f'(x) = 0</text>
            </g>

            <g transform="translate(205, 185)">
              <rect width="66" height="28" rx="14" fill="white" fill-opacity="0.9" filter="drop-shadow(0 4px 10px rgba(27,42,74,0.06))"/>
              <text x="33" y="18" font-family="Comfortaa" font-size="11" font-weight="700" fill="#1B2A4A" text-anchor="middle">∫ f(x)dx</text>
            </g>
          </svg>
        </div>
      </div>

      <!-- Bottom spacer for clean balanced layout -->
      <div class="relative z-10 text-xs text-[#1B2A4A]/50">
        © 2025 BQD Math. Nền tảng học Toán THPTQG.
      </div>
    </section>

    <!-- RIGHT COLUMN: LOGIN FORM CARD -->
    <section class="flex flex-col justify-center px-4 sm:px-8 lg:px-12 py-6">
      <div class="w-full max-w-[440px] mx-auto space-y-7">
        
        <!-- Form Title -->
        <div>
          <h2 class="text-3xl font-bold text-[#1B2A4A]">Đăng nhập</h2>
        </div>

        <!-- Form Elements -->
        <form class="space-y-5" onsubmit="event.preventDefault();">
          
          <!-- Input 1: Số điện thoại hoặc Email -->
          <div class="space-y-2">
            <label class="block text-xs font-semibold text-[#1B2A4A]">
              Số điện thoại hoặc Email
            </label>
            <div class="relative">
              <input 
                type="text" 
                value="hocsinh@bqdmath.vn" 
                placeholder="Nhập số điện thoại hoặc email" 
                class="w-full px-5 py-3.5 rounded-full border border-red-400 bg-white text-sm text-[#1B2A4A] placeholder-[#1B2A4A]/40 focus:outline-none focus:ring-2 focus:ring-[#1B2A4A]/20 transition shadow-sm"
              />
            </div>
          </div>

          <!-- Input 2: Mật khẩu (with show/hide eye icon) -->
          <div class="space-y-2">
            <label class="block text-xs font-semibold text-[#1B2A4A]">
              Mật khẩu
            </label>
            <div class="relative">
              <input 
                id="passwordInput"
                type="password" 
                value="••••••••••••" 
                placeholder="Nhập mật khẩu của bạn" 
                class="w-full px-5 py-3.5 pr-12 rounded-full border border-red-400 bg-white text-sm text-[#1B2A4A] placeholder-[#1B2A4A]/40 focus:outline-none focus:ring-2 focus:ring-[#1B2A4A]/20 transition shadow-sm"
              />
              <!-- Eye Show/Hide Icon Button -->
              <button 
                type="button" 
                onclick="togglePassword()"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-[#1B2A4A]/60 hover:text-[#1B2A4A] p-1 transition"
                aria-label="Hiện/ẩn mật khẩu"
              >
                <!-- Eye Open Icon -->
                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>

            <!-- Error State: "Sai thông tin đăng nhập" -->
            <div class="flex items-center gap-1.5 pt-1 text-xs font-medium text-red-600">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" stroke-width="1.8"/>
                <line x1="12" y1="8" x2="12" y2="12" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="15.5" r="0.75" fill="currentColor"/>
              </svg>
              <span>Sai thông tin đăng nhập</span>
            </div>
          </div>

          <!-- Row: Checkbox "Ghi nhớ đăng nhập" + Link "Quên mật khẩu?" -->
          <div class="flex items-center justify-between pt-1 text-xs">
            <label class="flex items-center gap-2 cursor-pointer select-none text-[#1B2A4A]/80 hover:text-[#1B2A4A]">
              <input 
                type="checkbox" 
                checked 
                class="w-4 h-4 rounded border-gray-300 text-[#1B2A4A] focus:ring-[#1B2A4A] accent-[#1B2A4A] cursor-pointer"
              />
              <span class="font-medium">Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="font-semibold text-[#1B2A4A] hover:underline">
              Quên mật khẩu?
            </a>
          </div>

          <!-- Primary Navy Pill Button "Đăng nhập" Full Width -->
          <div class="pt-2">
            <button 
              type="submit" 
              class="w-full py-4 px-6 rounded-full bg-[#1B2A4A] hover:bg-[#132039] active:scale-[0.99] text-white font-semibold text-sm shadow-soft transition-all duration-200"
            >
              Đăng nhập
            </button>
          </div>

          <!-- Divider "hoặc" -->
          <div class="relative py-2 flex items-center justify-center">
            <div class="w-full border-t border-[#1B2A4A]/10"></div>
            <span class="absolute bg-white px-4 text-xs text-[#1B2A4A]/50 font-medium lowercase">
              hoặc
            </span>
          </div>

          <!-- White Outline Pill Button "Tiếp tục với Google" -->
          <div>
            <button 
              type="button" 
              class="w-full py-3.5 px-6 rounded-full bg-white hover:bg-[#F2F8FD] active:scale-[0.99] border border-[#1B2A4A]/20 text-[#1B2A4A] font-semibold text-sm flex items-center justify-center gap-3 transition-all duration-200"
            >
              <!-- Google Color Icon -->
              <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Tiếp tục với Google</span>
            </button>
          </div>

          <!-- Bottom Text: "Chưa có tài khoản? Đăng ký" -->
          <div class="pt-3 text-center text-xs text-[#1B2A4A]/70">
            Chưa có tài khoản? 
            <a href="dang-ky.html" class="font-bold text-[#1B2A4A] hover:underline ml-1">
              Đăng ký
            </a>
          </div>

        </form>

      </div>
    </section>

  </main>

  <!-- Eye toggle script -->
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
        `;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        `;
      }
    }
  </script>
</body>
</html>
